name: PR Safety and Validation Check

on:
  pull_request:
    branches: [main]
    paths:
      - "submissions/**"
      - "skills/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AgentForge validation suite
        run: |
          python3 scripts/validate.py
