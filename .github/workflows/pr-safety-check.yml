name: PR Safety and Validation Check

on:
  pull_request:
    branches: [main]
    paths:
      - "submissions/**"
      - "skills/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AgentForge validation suite
        id: run_validation
        run: |
          set +e
          python3 scripts/validate.py > validation_output.txt 2>&1
          EXIT_CODE=$?
          cat validation_output.txt

          if [ $EXIT_CODE -ne 0 ]; then
            # Render report in GitHub Actions Step Summary tab
            echo "### [VALIDATION FAILED] AgentForge Quality Check" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat validation_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Notice**: Pull requests with unresolved validation errors will be automatically closed after 5 days of inactivity." >> $GITHUB_STEP_SUMMARY

            # Generate PR comment body file
            {
              echo "### [VALIDATION FAILED] AgentForge Quality Check"
              echo ""
              echo "This submission does not conform to repository standards:"
              echo ""
              echo '```text'
              cat validation_output.txt
              echo '```'
              echo ""
              echo "---"
              echo "> **Notice**: Please push a commit with the required corrections. Pull requests with unresolved validation errors will be **automatically closed after 5 days** of inactivity."
            } > pr_comment.md
          fi

          exit $EXIT_CODE

      - name: On Failure - Label PR and Post Guidance
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label "status: invalid-submission" || true
          if [ -f pr_comment.md ]; then
            gh pr comment "$PR_NUMBER" --body-file pr_comment.md || true
          fi

      - name: On Success - Remove Invalid Labels
        if: success() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "status: invalid-submission" || true
          gh pr edit "$PR_NUMBER" --remove-label "status: stale-invalid" || true
