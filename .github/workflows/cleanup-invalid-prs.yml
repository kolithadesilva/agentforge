name: Cleanup Stale Invalid PRs

on:
  schedule:
    - cron: "0 2 * * *" # Runs daily at 2:00 AM UTC
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  pull-requests: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-close uncorrected invalid PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          only-pr-labels: "status: invalid-submission"
          days-before-pr-stale: 3
          days-before-pr-close: 2
          stale-pr-label: "status: stale-invalid"
          stale-pr-message: |
            ### [NOTICE] Inactivity Warning: PR will close in 2 days

            This pull request contains validation errors and has been inactive for 3 days.
            Please push the required corrections to keep this submission open.

            If no updates are pushed, this pull request will be **automatically closed in 2 days**.
          close-pr-message: |
            ### [CLOSED] Pull Request Automatically Closed

            This submission has been automatically closed because the validation errors were not resolved within 5 days.

            You are welcome to submit a corrected version anytime!
